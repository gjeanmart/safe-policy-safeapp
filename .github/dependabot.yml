version: 2
updates:
  # npm ecosystem also covers pnpm (reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same idea as minimumReleaseAge: let fresh releases settle before proposing them.
    cooldown:
      default-days: 3
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
