# pnpm settings (single-package repo, no workspace packages).

# Supply-chain hygiene: only resolve versions published at least 1 day ago (in minutes);
# most malicious releases are detected and pulled within hours.
minimumReleaseAge: 1440

# Refuse to install with an unsupported Node / pnpm version (see "engines" in package.json).
engineStrict: true

# Dependency lifecycle scripts (postinstall, …) are blocked by default in pnpm 10.
# None of the current dependencies need one; add a package here only after reviewing its script.
onlyBuiltDependencies: []
